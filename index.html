<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン人狼役職配り</title>
    <!-- Firebase (v9互換) の読み込み -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; overflow-y: auto; }
        h1 { color: #e74c3c; font-size: 24px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(231,76,60,0.4); }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 440px; margin: 20px auto; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background: #e74c3c; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .hidden { display: none !important; }
        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; text-align: left; }
        .role-item { background: #2a2a2a; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border: 1px solid #444; cursor: pointer; }
        .role-item input { width: 50px; padding: 6px; margin: 0; text-align: center; font-size: 14px; }
        .member-badge { display: inline-block; background: #2980b9; padding: 6px 12px; border-radius: 20px; margin: 5px; font-weight: bold; }
        .info-title { color: #888; font-size: 14px; margin-top: 40px; margin-bottom: 10px; letter-spacing: 2px; }
        .role-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 440px; margin: 0 auto 40px auto; }
        .role-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.2s; }
        .role-card:hover { border-color: #e74c3c; background: #252525; }
        .role-card .icon { font-size: 24px; margin-bottom: 5px; }
        .role-card .name { font-weight: bold; font-size: 14px; }
        .room-number-display { position: absolute; top: 10px; right: 15px; font-size: 12px; color: #888; letter-spacing: 1px; }
        .setting-info { background: #252525; padding: 10px; border-radius: 6px; margin: 15px 0; text-align: left; font-size: 14px; border-left: 4px solid #e74c3c; }
        .setting-info div { margin: 4px 0; }
        .status-alert { color: #e74c3c; font-weight: bold; }
        .status-ok { color: #2ecc71; font-weight: bold; }
        .guest-waiting-msg { color: #f39c12; font-weight: bold; margin: 20px 0; font-size: 16px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        #reveal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 1s ease-in-out, visibility 1s; padding: 20px; box-sizing: border-box; }
        #reveal-overlay.active { opacity: 1; visibility: visible; }
        .fade-in-text { font-size: 20px; color: #aaa; margin-bottom: 20px; opacity: 0; }
        .fade-in-illustration { font-size: 80px; margin-bottom: 15px; opacity: 0; }
        .fade-in-rolename { font-size: 32px; color: #e74c3c; font-weight: bold; margin-bottom: 30px; opacity: 0; text-shadow: 0 0 15px rgba(231,76,60,0.6); }
        .reveal-btn-container { width: 100%; max-width: 250px; opacity: 0; }
        .animate-fade-in { animation: fadeIn 1.2s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: #222; border: 1px solid #444; padding: 25px; border-radius: 12px; max-width: 360px; width: 85%; box-shadow: 0 5px 15px rgba(0,0,0,0.8); animation: scaleUp 0.2s ease-out; }
        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-illustration { font-size: 60px; margin-bottom: 10px; }
        .modal-title { font-size: 20px; color: #e74c3c; font-weight: bold; margin-bottom: 15px; }
        .modal-description { font-size: 14px; color: #ddd; line-height: 1.6; text-align: left; background: #1a1a1a; padding: 12px; border-radius: 6px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>オンライン人狼役職配り</h1>
    <div id="screen-home" class="panel">
        <input type="text" id="player-name" placeholder="あなたのプレイヤー名">
        <button id="btn-create-room" style="background: #27ae60; margin-top: 15px;">部屋を作る</button>
        <div style="margin: 15px 0; color: #888; font-size: 14px;">または</div>
        <input type="number" id="room-input" placeholder="4桁の部屋番号を入力">
        <button id="btn-join-room">部屋に入って参加する</button>
        <div class="info-title">役職一覧（タップで詳細を表示）</div>
        <div class="role-list">
            <div class="role-card" onclick="showRoleDetail('人狼')"><div class="icon">🐺</div><div class="name">人狼</div></div>
            <div class="role-card" onclick="showRoleDetail('狂人')"><div class="icon">🤡</div><div class="name">狂人</div></div>
            <div class="role-card" onclick="showRoleDetail('村人')"><div class="icon">🧑</div><div class="name">村人</div></div>
            <div class="role-card" onclick="showRoleDetail('占い師')"><div class="icon">🔮</div><div class="name">占い師</div></div>
            <div class="role-card" onclick="showRoleDetail('裁判官')"><div class="icon">⚖️</div><div class="name">裁判官</div></div>
            <div class="role-card" onclick="showRoleDetail('スペシャルマン')"><div class="icon">🦸💥</div><div class="name">スペシャル</div></div>
        </div>
    </div>
    <!-- 2. ルーム画面（オーナー・参加者共通） -->
    <div id="screen-room" class="panel hidden">
        <div class="room-number-display">部屋番号: <span id="display-room-id">0000</span></div>
        <h2 id="room-role-title" style="font-size: 18px; margin-top: 10px; color: #3498db;">待機ロビー</h2>

        <div class="setting-info">
            <div>👥 参加人数: <span id="count-players">0</span> 人</div>
            <div>🃏 選択された役職の合計: <span id="count-roles">0</span> 枚</div>
            <div>⚠️ 人数チェック: <span id="status-toggle">OFF</span></div>
        </div>

        <div id="guest-notice" class="guest-waiting-msg hidden">オーナーが設定しています。開始をお待ちください...</div>

        <div id="owner-settings-area" class="hidden">
            <div style="font-size: 14px; text-align: left; color: #aaa; margin-bottom: 5px;">役職配分設定（タップで詳細）</div>
            <div class="role-grid">
                <div class="role-item" onclick="handleRoleItemClick(event, '人狼')">
                    <span>🐺 人狼</span><input type="number" id="num-werewolf" value="1" min="0" onchange="calcRoleTotal()">
                </div>
                <div class="role-item" onclick="handleRoleItemClick(event, '狂人')">
                    <span>🤡 狂人</span><input type="number" id="num-madman" value="0" min="0" onchange="calcRoleTotal()">
                </div>
                <div class="role-item" onclick="handleRoleItemClick(event, '村人')">
                    <span>🧑 村人</span><input type="number" id="num-citizen" value="2" min="0" onchange="calcRoleTotal()">
                </div>
                <div class="role-item" onclick="handleRoleItemClick(event, '占い師')">
                    <span>🔮 占い師</span><input type="number" id="num-seer" value="1" min="0" onchange="calcRoleTotal()">
                </div>
                <div class="role-item" onclick="handleRoleItemClick(event, '裁判官')">
                    <span>⚖️ 裁判官</span><input type="number" id="num-judge" value="0" min="0" onchange="calcRoleTotal()">
                </div>
                <div class="role-item" onclick="handleRoleItemClick(event, 'スペシャルマン')">
                    <span>🦸 スペシャル</span><input type="number" id="num-specialman" value="0" min="0" onchange="calcRoleTotal()">
                </div>
            </div>
            <button id="btn-start-game" disabled>スタートボタン</button>
        </div>

        <div style="font-size: 14px; text-align: left; color: #aaa; margin-top: 15px;">参加中のプレイヤー:</div>
        <div id="player-list-area" style="text-align: left; margin-bottom: 20px;"></div>
        <button id="btn-reset-room" class="hidden" style="background: #34495e;">全員を部屋に戻る</button>
    </div>

    <!-- 🎭 役職配布のドラマチック演出画面 -->
    <div id="reveal-overlay">
        <div class="fade-in-text" id="reveal-intro">あなたの役職は、、、</div>
        <div class="fade-in-illustration" id="reveal-icon">❓</div>
        <div class="fade-in-rolename" id="reveal-name">役職名</div>
        <div class="reveal-btn-container" id="reveal-btn-wrap">
            <button id="btn-confirm-role" style="background: #2ecc71;">役職確認ボタン</button>
        </div>
    </div>

    <!-- 📋 役職詳細ポップアップモーダル -->
    <div id="detail-modal" class="modal-overlay hidden" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-illustration" id="modal-illustration">🐺</div>
            <div class="modal-title" id="modal-title">役職名</div>
            <div class="modal-description" id="modal-description">説明文</div>
            <button onclick="closeModal()" style="background: #555; padding: 8px; margin: 0; width: 80px;">閉じる</button>
        </div>
    </div>

    <script>
        const ROLE_DETAILS = {
            '人狼': { icon: '🐺', desc: '【人狼陣営】\nわざと自分のチームを負けさせれば勝ち。\n\n◆ ポイント ◆\n・試合に勝利：-1\n・バレずに試合に敗北：+3\n・バレて試合に敗北：+1' },
            '狂人': { icon: '🤡', desc: '【人狼、第3陣営】\n自分に最も多く票を集めれば勝ち。\n\n◆ ポイント ◆\n・最も票を集める：+4' },
            '村人': { icon: '🧑', desc: '【村人陣営】\n味方と協力し試合に勝ち、人狼を見つけ出したら勝ち。\n\n◆ ポイント ◆\n・試合に勝利：+2' },
            '占い師': { icon: '🔮', desc: '【村人陣営】\n味方と協力し試合に勝ち、人狼を見つけ出したら勝ち。\n\n◆ 能力 ◆\n7キルしたら発動。指定した1人の役職をその場で発表してもらう。\n\n◆ ポイント ◆\n・試合に勝利：+2' },
            '裁判官': { icon: '⚖️', desc: '【村人陣営】\n味方と協力し試合に勝ち、人狼を見つけ出したら勝ち。\n\n◆ 能力 ◆\n5キルしたら発動。1試合目と2試合目の間のみ発動可能。票が多かった人は次の試合参加できない。\nまた人狼が1人で人狼が釣られた場合、その場で終了となり、村人陣営に1ポイント入る。\n\n◆ ポイント ◆\n・試合に勝利：+2' },
            'スペシャルマン': { icon: '🦸💥', desc: '【第三陣営】\nポイントを集めるための役職。第三陣営なので、人狼、村人、どちらに付いても良い。\n\n◆ ポイント ◆\n・2試合ではいたスペシャルの数がポイントになる。' }
        };

        const firebaseConfig = { apiKey: "", authDomain: "", databaseURL: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
        let db = null; let isFirebaseConnected = false;

        if (firebaseConfig.databaseURL) {
            try { firebase.initializeApp(firebaseConfig); db = firebase.database(); isFirebaseConnected = true; } catch (e) { console.error(e); }
        }

        let myState = { roomId: null, playerId: null, name: '', isOwner: false, role: '', icon: '' };
        let localDB = {};

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-create-room').addEventListener('click', createRoom);
            document.getElementById('btn-join-room').addEventListener('click', joinRoom);
            document.getElementById('btn-start-game').addEventListener('click', startGame);
            document.getElementById('btn-confirm-role').addEventListener('click', confirmRole);
            document.getElementById('btn-reset-room').addEventListener('click', resetRoom);
            calcRoleTotal();
        });

        function showRoleDetail(roleName) {
            const data = ROLE_DETAILS[roleName]; if (!data) return;
            document.getElementById('modal-illustration').innerText = data.icon;
            document.getElementById('modal-title').innerText = roleName;
            document.getElementById('modal-description').innerText = data.desc;
            document.getElementById('detail-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
        function handleRoleItemClick(event, roleName) { if (event.target.tagName === 'INPUT') return; showRoleDetail(roleName); }

        function calcRoleTotal() {
            const countW = parseInt(document.getElementById('num-werewolf').value) || 0;
            const countM = parseInt(document.getElementById('num-madman').value) || 0;
            const countC = parseInt(document.getElementById('num-citizen').value) || 0;
            const countS = parseInt(document.getElementById('num-seer').value) || 0;
            const countJ = parseInt(document.getElementById('num-judge').value) || 0;
            const countSM = parseInt(document.getElementById('num-specialman').value) || 0;
            const totalRoles = countW + countM + countC + countS + countJ + countSM;
            document.getElementById('count-roles').innerText = totalRoles;
            const totalPlayers = parseInt(document.getElementById('count-players').innerText) || 0;
            const toggleEl = document.getElementById('status-toggle');
            if (totalRoles === totalPlayers && totalPlayers > 0) {
                toggleEl.innerText = "OFF"; toggleEl.className = "status-ok"; document.getElementById('btn-start-game').disabled = false;
            } else {
                toggleEl.innerText = "ON (不一致)"; toggleEl.className = "status-alert"; document.getElementById('btn-start-game').disabled = true;
            }
            return { '人狼': countW, '狂人': countM, '村人': countC, '占い師': countS, '裁判官': countJ, 'スペシャルマン': countSM };
        }

        function createRoom() {
            const name = document.getElementById('player-name').value.trim(); if (!name) return alert("名前を入力してください");
            const randomId = Math.floor(1000 + Math.random() * 9000).toString();
            myState.roomId = randomId; myState.playerId = "player_" + Date.now(); myState.name = name; myState.isOwner = true;
            setupRoomUI();
            const initialData = { status: 'waiting', owner: myState.playerId, players: { [myState.playerId]: { name: name, role: "", confirmed: false } } };
            if (isFirebaseConnected) { db.ref('rooms/' + randomId).set(initialData); listenToRoom(randomId); }
            else { localDB[randomId] = initialData; simulateLocalRoom(randomId); alert("【テストモード】この画面内のみで連動テストができます。"); }
        }

        function joinRoom() {
            const name = document.getElementById('player-name').value.trim();
            const rId = document.getElementById('room-input').value.trim();
            if (!name || !rId) return alert("名前と4桁の部屋番号を入力してください");
            myState.roomId = rId; myState.playerId = "player_" + Date.now(); myState.name = name; myState.isOwner = false;
            if (isFirebaseConnected) {
                db.ref('rooms/' + rId).once('value', (snapshot) => {
                    if (!snapshot.exists()) return alert("部屋が見つかりません");
                    db.ref('rooms/' + rId + '/players/' + myState.playerId).set({ name: name, role: "", confirmed: false });
                    setupRoomUI(); listenToRoom(rId);
                });
            } else {
                if (!localDB[rId]) return alert("部屋が見つかりません");
                localDB[rId].players[myState.playerId] = { name: name, role: "", confirmed: false };
                setupRoomUI(); simulateLocalRoom(rId);
            }
        }

        function setupRoomUI() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-room').classList.remove('hidden');
            document.getElementById('display-room-id').innerText = myState.roomId;
            if (myState.isOwner) {
                document.getElementById('room-role-title').innerText = "👑 オーナー待機部屋";
                document.getElementById('owner-settings-area').classList.remove('hidden');
            } else {
        function listenToRoom(roomId) { db.ref('rooms/' + roomId).on('value', (snapshot) => { const data = snapshot.val(); if (data) updateRoomState(data); }); }

        function updateRoomState(data) {
            const playerArea = document.getElementById('player-list-area'); playerArea.innerHTML = '';
            let pCount = 0; let allConfirmed = true; const playersObj = data.players || {};
            Object.keys(playersObj).forEach(pId => {
                pCount++; const p = playersObj[pId]; const badge = document.createElement('span'); badge.className = 'member-badge';
                let statusText = p.confirmed ? " (確認済)" : "";
                if (pId === data.owner) { badge.innerText = `👑 ${p.name}${statusText}`; badge.style.background = "#e67e22"; }
                else { badge.innerText = `${p.name}${statusText}`; }
                playerArea.appendChild(badge); if (!p.confirmed) allConfirmed = false;
            });
            document.getElementById('count-players').innerText = pCount; calcRoleTotal();
            if (data.status === 'playing' && myState.role === '') {
                const myInfo = playersObj[myState.playerId];
                if (myInfo && myInfo.role) { myState.role = myInfo.role; myState.icon = ROLE_DETAILS[myInfo.role]?.icon || '❓'; triggerRevealAnimation(); }
            }
            if (data.status === 'playing' && allConfirmed && myState.isOwner) { document.getElementById('btn-reset-room').classList.remove('hidden'); }
            else { document.getElementById('btn-reset-room').classList.add('hidden'); }
            if (data.status === 'waiting' && myState.role !== '') {
                myState.role = ''; myState.icon = ''; document.getElementById('reveal-overlay').classList.remove('active');
                document.getElementById('reveal-intro').classList.remove('animate-fade-in');
                document.getElementById('reveal-icon').classList.remove('animate-fade-in');
                document.getElementById('reveal-name').classList.remove('animate-fade-in');
                document.getElementById('reveal-btn-wrap').classList.remove('animate-fade-in');
            }
        }

        function startGame() {
            const distribution = calcRoleTotal(); let rolePool = [];
            Object.keys(distribution).forEach(rName => { for (let i = 0; i < distribution[rName]; i++) { rolePool.push(rName); } });
            for (let i = rolePool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]]; }
            if (isFirebaseConnected) {
                db.ref('rooms/' + myState.roomId + '/players').once('value', (snapshot) => {
                    const players = snapshot.val(); let index = 0;
                    Object.keys(players).forEach(pId => { players[pId].role = rolePool[index] || '村人'; players[pId].confirmed = false; index++; });
                    db.ref('rooms/' + myState.roomId).update({ status: 'playing', players: players });
                });
            } else {
                let index = 0;
                Object.keys(localDB[myState.roomId].players).forEach(pId => { localDB[myState.roomId].players[pId].role = rolePool[index] || '村人'; localDB[myState.roomId].players[pId].confirmed = false; index++; });
                localDB[myState.roomId].status = 'playing'; updateRoomState(localDB[myState.roomId]);
            }
        }

        function triggerRevealAnimation() {
            const overlay = document.getElementById('reveal-overlay');
            document.getElementById('reveal-icon').innerText = myState.icon; document.getElementById('reveal-name').innerText = myState.role;
            overlay.classList.add('active');
            setTimeout(() => { document.getElementById('reveal-intro').classList.add('animate-fade-in'); }, 1000);
            setTimeout(() => { document.getElementById('reveal-icon').classList.add('animate-fade-in'); document.getElementById('reveal-name').classList.add('animate-fade-in'); }, 2200);
            setTimeout(() => { document.getElementById('reveal-btn-wrap').classList.add('animate-fade-in'); }, 3500);
        }

        function confirmRole() {
            if (isFirebaseConnected) { db.ref('rooms/' + myState.roomId + '/players/' + myState.playerId).update({ confirmed: true }); }
            else { localDB[myState.roomId].players[myState.playerId].confirmed = true; updateRoomState(localDB[myState.roomId]); }
            alert("あなたの役職確認を記録しました。全員が確認を終えるまでお待ちください。");
        }

        function resetRoom() {
            if (isFirebaseConnected) {
                db.ref('rooms/' + myState.roomId + '/players').once('value', (snapshot) => {
                    const players = snapshot.val(); Object.keys(players).forEach(pId => { players[pId].role = ""; players[pId].confirmed = false; });
                    db.ref('rooms/' + myState.roomId).update({ status: 'waiting', players: players });
                });
            } else {
                Object.keys(localDB[myState.roomId].players).forEach(pId => { localDB[myState.roomId].players[pId].role = ""; localDB[myState.roomId].players[pId].confirmed = false; });
                localDB[myState.roomId].status = 'waiting'; updateRoomState(localDB[myState.roomId]);
            }
        }

        function simulateLocalRoom(roomId) { setInterval(() => { if (!isFirebaseConnected && localDB[roomId]) { updateRoomState(localDB[roomId]); } }, 1000); }
    </script>
</body>
</html>
