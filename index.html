
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オンライン人狼役職配り</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background:
        radial-gradient(circle at top, #2d3857 0%, #121626 45%, #090b12 100%);
      color: white;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
      padding: 24px;
    }

    .center {
      max-width: 850px;
      margin: 0 auto;
    }

    /* =========================
       トップ
    ========================= */

    .top-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .title-box {
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    .title-box h1 {
      font-size: clamp(30px, 8vw, 56px);
      margin: 0 0 12px;
      letter-spacing: 2px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .main-buttons {
      display: grid;
      gap: 14px;
    }

    .main-button {
      border: 0;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #526dff;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    .main-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .main-button.secondary {
      background: #252b40;
    }

    /* =========================
       共通カード
    ========================= */

    .card {
      background: rgba(22, 27, 45, .88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
    }

    .card h2 {
      margin-top: 0;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #3d4662;
      background: #111522;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #6e83ff;
    }

    .primary {
      border: 0;
      border-radius: 14px;
      padding: 15px;
      background: #526dff;
      color: white;
      font-weight: bold;
    }

    .back-button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      background: #292f43;
      color: white;
    }

    .error {
      color: #ff8d8d;
      background: rgba(255, 80, 80, .1);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
    }

    /* =========================
       部屋
    ========================= */

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .room-code {
      font-size: 13px;
      opacity: .7;
      text-align: right;
    }

    .room-code strong {
      display: block;
      font-size: 25px;
      letter-spacing: 4px;
      opacity: 1;
    }

    .room-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 700px) {
      .room-grid {
        grid-template-columns: 1fr;
      }
    }

    .players {
      display: grid;
      gap: 9px;
      margin-top: 15px;
    }

    .player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px;
      border-radius: 12px;
      background: #121725;
    }

    .owner-badge {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 8px;
      background: #6656d9;
    }

    .waiting {
      color: #aeb7cf;
      font-size: 14px;
    }

    /* =========================
       役職設定
    ========================= */

    .role-settings {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .role-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #111522;
      border-radius: 13px;
    }

    .role-setting-name {
      font-weight: bold;
    }

    .role-setting-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #303850;
      font-size: 20px;
    }

    .count {
      min-width: 24px;
      text-align: center;
      font-weight: bold;
    }

    .off {
      opacity: .45;
    }

    .total-box {
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: #20263a;
      text-align: center;
    }

    /* =========================
       役職一覧
    ========================= */

    .roles-title {
      margin-top: 35px;
    }

    .role-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 650px) {
      .role-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .role-card {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 12px;
      background: #141a2a;
      color: white;
      text-align: center;
      transition: transform .2s;
      animation: floating 2.8s ease-in-out infinite;
    }

    .role-card:nth-child(2) {
      animation-delay: -.5s;
    }

    .role-card:nth-child(3) {
      animation-delay: -1s;
    }

    .role-card:nth-child(4) {
      animation-delay: -1.5s;
    }

    .role-card:nth-child(5) {
      animation-delay: -2s;
    }

    .role-card:nth-child(6) {
      animation-delay: -2.5s;
    }

    .role-card:hover {
      transform: scale(1.03);
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .role-card img,
    .role-image-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 13px;
      background: #242b40;
    }

    .role-image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

      margin: 10px 0 4px;
    }

    .role-card p {
      margin: 0;
      font-size: 12px;
      opacity: .65;
    }

    /* =========================
       役職詳細
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.72);
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #151a2a;
      border-radius: 25px;
      padding: 22px;
      box-shadow: 0 20px 70px rgba(0,0,0,.5);
    }

    .detail-image {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 18px;
      background: #252b40;
    }

    .detail-placeholder {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      background: #252b40;
      border-radius: 18px;
    }

    .detail-text {
      line-height: 1.8;
      white-space: pre-line;
      color: #e5e9f4;
    }

    .close-button {
      width: 100%;
      margin-top: 15px;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #303850;
      color: white;
    }

    /* =========================
       役職配布
    ========================= */

    .deal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(3,5,10,.96);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: darken .8s ease;
    }

    @keyframes darken {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .deal-box {
      width: min(520px, 100%);
      text-align: center;
    }

    .deal-intro {
      font-size: 24px;
      margin-bottom: 22px;
    }

    .deal-role {
      font-size: clamp(38px, 10vw, 64px);
      font-weight: bold;
      margin: 18px 0;
    }

    .deal-image {
      width: min(380px, 85vw);
      max-height: 430px;
      object-fit: contain;
      border-radius: 20px;
      background: #1b2133;
    }

    .deal-placeholder {
      width: min(380px, 85vw);
      height: 380px;
      margin: 0 auto;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b2133;
      font-size: 120px;
    }

    .confirm-button {
      margin-top: 24px;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 17px;
      color: white;
      background: #526dff;
      font-size: 18px;
      font-weight: bold;
    }

    .confirmed-message {
      margin-top: 18px;
      opacity: .7;
    }

    /* =========================
       ローディング
    ========================= */

    .loading {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090b12;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #30374e;
      border-top-color: #6d80ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 600;
      background: #252c40;
      padding: 13px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
  </style>
</head>

<body>

  <!-- =========================

<script>
/* =========================================================
   Supabase設定
========================================================= */

const SUPABASE_URL =
  "https://bduxxzvavgknaxnmvtbv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qvHMK89PQngzq72Ttn9aZA_BfkThD4W";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   役職データ
========================================================= */

const ROLES = {

  "村人": {

`村人陣営

味方と協力し試合に勝ち、

試合に勝利 +2`,
    listImage: "assets/murabito-list.png",

  },

  "占い師": {

    short: "7キルで1人の役職を発表",
    description:
`村人陣営

【ポイント】

  "裁判官": {

    short: "5キルで裁判官の能力を発動",

`村人陣営

  "スペシャルマン": {

【ポイント】
2試合ではいた
スペシャルの数がポイントになる。`,
    emoji: "⭐"
  }

};


/* =========================================================
   状態
========================================================= */

let currentRoomCode = null;
let currentPlayerToken = null;
let currentOwnerToken = null;
let currentRole = null;
let currentIsOwner = false;
let pollingTimer = null;
let lastStatus = null;


/* =========================================================
   画面切り替え
========================================================= */

function hideAllScreens() {

  document
    .querySelectorAll(".screen")
    .forEach(el => {
      el.classList.add("hidden");
    });
}


function goHome() {

  stopPolling();

  currentRoomCode = null;
  currentPlayerToken = null;
  currentOwnerToken = null;
  currentRole = null;

  hideAllScreens();

  document
    .getElementById("homeScreen")
    .classList.remove("hidden");
}


function showCreateScreen() {

  hideAllScreens();

  document
    .getElementById("createScreen")
    .classList.remove("hidden");

  document
    .getElementById("createName")
    .focus();
}


function showJoinScreen() {

  hideAllScreens();

  document
    .getElementById("joinScreen")
    .classList.remove("hidden");

  document
    .getElementById("joinName")
    .focus();
}


/* =========================================================
   ローディング
========================================================= */

function showLoading(show) {

  document
    .getElementById("loading")
    .classList.toggle(
      "hidden",
      !show
    );
}


/* =========================================================
   エラー
========================================================= */

function showError(id, message) {

  const el =
    document.getElementById(id);

  el.textContent = message;
  el.classList.remove("hidden");
}


function clearError(id) {

  document
    .getElementById(id)
    .classList.add("hidden");
}


/* =========================================================
   トースト
========================================================= */

let toastTimer;

function toast(message) {

  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    el.classList.add("hidden");
  }, 2500);
}


/* =========================================================
   部屋を作る
========================================================= */

async function createRoom() {

  clearError("createError");

  const name =
    document
      .getElementById("createName")
      .value
      .trim();

  if (!name) {
    showError(
      "createError",
      "名前を入力してください。"
    );
    return;
  }

  showLoading(true);

  try {

    const { data, error } =
      await supabaseClient.rpc(
        "create_room",
        {
          p_player_name: name
        }
      );

    if (error) {
      throw error;
    }

    currentRoomCode =
      data.room_code;

    currentPlayerToken =
      data.player_token;

    currentOwnerToken =
      data.owner_token;

    currentIsOwner = true;

    saveSession();

    await openRoom();

  } catch (error) {

    console.error(error);

    showError(
      "createError",
      getErrorMessage(error)
    );

  } finally {

    showLoading(false);

  }
}


/* =========================================================
   部屋に参加
========================================================= */

async function joinRoom() {

  clearError("joinError");

  const name =
    document
      .getElementById("joinName")
      .value
      .trim();

  const code =
    document
      .getElementById("joinCode")
      .value
      .trim();

  if (!name) {
    showError(
      "joinError",
      "名前を入力してください。"
    );
    return;
  }

  if (!/^\d{4}$/.test(code)) {
    showError(
      "joinError",
      "4桁の部屋番号を入力してください。"
    );
    return;
  }

  showLoading(true);

  try {

    const { data, error } =
      await supabaseClient.rpc(
        "join_room",
        {
          p_room_code: code,
          p_player_name: name
        }
      );

    if (error) {
      throw error;
    }

    currentRoomCode =
      data.room_code;

    currentPlayerToken =
      data.player_token;

    currentOwnerToken = null;
    currentIsOwner = false;

    saveSession();

    await openRoom();

  } catch (error) {

    console.error(error);

    showError(
      "joinError",
      getErrorMessage(error)
    );

  } finally {

    showLoading(false);

  }
}


/* =========================================================
   セッション保存
========================================================= */

function saveSession() {

  localStorage.setItem(
    "liora_room_code",
    currentRoomCode || ""
  );

  localStorage.setItem(
    "liora_player_token",
    currentPlayerToken || ""
  );

  localStorage.setItem(
    "liora_owner_token",
    currentOwnerToken || ""
  );
}


/* =========================================================
   部屋を開く
========================================================= */

async function openRoom() {

  hideAllScreens();

  document
    .getElementById("roomScreen")
    .classList.remove("hidden");

  document
    .getElementById("roomCodeText")
    .textContent =
    currentRoomCode;

  startPolling();

  await refreshRoom();
}


/* =========================================================
   部屋情報取得
========================================================= */

async function refreshRoom() {

  if (
    !currentRoomCode ||
    !currentPlayerToken
  ) {
    return;
  }

  try {

    const { data, error } =
      await supabaseClient.rpc(
        "get_room",
        {
          p_room_code: currentRoomCode,
          p_player_token: currentPlayerToken
        }
      );

    if (error) {
      throw error;
    }

    currentIsOwner =
      !!data.is_owner;

    renderRoom(data);

    if (
      data.status === "started" &&
      data.my_role
    ) {

      currentRole =
        data.my_role;

      showDealScreen(
        data.my_role,
        data.my_confirmed
      );

    } else {

      closeDealScreen();

    }

    lastStatus = data.status;

  } catch (error) {

    console.error(error);

  }
}


/* =========================================================
   部屋表示
========================================================= */

function renderRoom(data) {

  document
    .getElementById("roomCodeText")
    .textContent =
    data.room_code;

  document
    .getElementById("playerCount")
    .textContent =
    data.players.length;


  const players =
    document.getElementById(
      "playersList"
    );

  players.innerHTML = "";


  data.players.forEach(
    (player, index) => {

      const div =
        document.createElement("div");

      div.className = "player";

      const left =
        document.createElement("span");

      left.textContent =
        player.name;

      const right =
        document.createElement("span");

      if (
        index === 0
      ) {

        right.textContent =
          "オーナー";

        right.className =
          "owner-badge";

      } else if (
        data.status === "started" &&
        player.confirmed
      ) {

        right.textContent =
          "確認済み";

        right.className =
          "owner-badge";

      }

      div.appendChild(left);
      div.appendChild(right);

      players.appendChild(div);

    }
  );


  if (data.is_owner) {

    document
      .getElementById("ownerPanel")
      .classList.remove("hidden");

    document
      .getElementById("guestPanel")
      .classList.add("hidden");

    renderSettings(
      data.settings
    );

    if (
      data.status === "started"
    ) {

      document
        .getElementById("startButton")
        .classList.add("hidden");

      document
        .getElementById("returnButton")
        .classList.remove("hidden");

    } else {

      document
        .getElementById("startButton")
        .classList.remove("hidden");

      document
        .getElementById("returnButton")
        .classList.add("hidden");

    }

  } else {

    document
      .getElementById("ownerPanel")
      .classList.add("hidden");

    document
      .getElementById("guestPanel")
      .classList.remove("hidden");

  }


  if (
    data.status === "waiting"
  ) {

    document
      .getElementById("roomStatusText")
      .textContent =
      data.is_owner
        ? "設定してゲームを開始してください"
        : "オーナーが設定しています";

  } else {

    document
      .getElementById("roomStatusText")
      .textContent =
      "ゲーム中";

  }
}


/* =========================================================
   設定表示
========================================================= */

function renderSettings(settings) {

  const container =
    document.getElementById(
      "roleSettings"
    );

  container.innerHTML = "";

  let total = 0;

  Object.keys(ROLES).forEach(
    role => {

      const count =
        Number(settings[role] || 0);

      total += count;

      const row =
        document.createElement("div");

      row.className =
        "role-setting";

      if (count === 0) {
        row.classList.add("off");
      }

      row.innerHTML = `
        <div class="role-setting-name">
          ${escapeHtml(role)}
        </div>

        <div class="role-setting-controls">

          <button
            class="count-button"
            onclick="changeRoleCount('${escapeAttr(role)}', -1)">
            −
          </button>

          <span class="count">
            ${count}
          </span>

          <button
            class="count-button"
            onclick="changeRoleCount('${escapeAttr(role)}', 1)">
            ＋
          </button>

        </div>
      `;

      container.appendChild(row);

    }
  );

  document
    .getElementById("roleTotal")
    .textContent = total;
}


/* =========================================================
   役職数変更
========================================================= */

async function changeRoleCount(
  role,
  amount
) {

  if (!currentIsOwner) {
    return;
  }

  try {

    const { data, error } =
      await supabaseClient.rpc(
        "get_room",
        {
          p_room_code: currentRoomCode,
          p_player_token: currentPlayerToken
        }
      );

    if (error) {
      throw error;
    }

    const settings =
      { ...data.settings };

    let next =
      Number(settings[role] || 0)
      + amount;

    if (next < 0) {
      next = 0;
    }

    if (next > 20) {
      next = 20;
    }

    settings[role] = next;

    const result =
      await supabaseClient.rpc(
        "update_settings",
        {
          p_room_code:
            currentRoomCode,

          p_owner_token:
            currentOwnerToken,

          p_settings:
            settings
        }
      );

    if (result.error) {
      throw result.error;
    }

    renderSettings(settings);

  } catch (error) {

    console.error(error);

    toast(
      getErrorMessage(error)
    );

  }
}


/* =========================================================
   ゲーム開始
========================================================= */

async function startGame() {

  if (!currentIsOwner) {
    return;
  }

  try {

    const result =
      await supabaseClient.rpc(
        "start_game",
        {
          p_room_code:
            currentRoomCode,

          p_owner_token:
            currentOwnerToken
        }
      );

    if (result.error) {
      throw result.error;
    }

    toast("役職を配布しました！");

    await refreshRoom();

  } catch (error) {

    console.error(error);

    toast(
      getErrorMessage(error)
    );

  }
}


/* =========================================================
   役職配布画面
========================================================= */

function showDealScreen(
  role,
  confirmed
) {

  const overlay =
    document.getElementById(
      "dealOverlay"
    );

  const content =
    document.getElementById(
      "dealContent"
    );

  const info =
    ROLES[role];

  if (!info) {
    return;
  }

  let imageHtml = "";

  if (info.dealImage) {

    imageHtml = `
      <img
        class="deal-image"
        src="${info.dealImage}"
        alt="${escapeAttr(role)}"
        onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
      <div class="deal-placeholder hidden">
        ${info.emoji}
      </div>
    `;

  } else {

    imageHtml = `
      <div class="deal-placeholder">
        ${info.emoji}
      </div>
    `;

  }


  content.innerHTML = `
    ${imageHtml}

    <div class="deal-role">
      ${escapeHtml(role)}
    </div>

    <div style="opacity:.65;">
      ${escapeHtml(info.team)}
    </div>
  `;


  document
    .getElementById(
      "confirmRoleButton"
    )
    .classList.toggle(
      "hidden",
      confirmed
    );


  document
    .getElementById(
      "confirmedMessage"
    )
    .classList.toggle(
      "hidden",
      !confirmed
    );


  overlay.classList.remove(
    "hidden"
  );
}


function closeDealScreen() {

  document
    .getElementById(
      "dealOverlay"
    )
    .classList.add("hidden");

}


/* =========================================================
   役職確認
========================================================= */

async function confirmMyRole() {

  try {

    const result =
      await supabaseClient.rpc(
        "confirm_role",
        {
          p_room_code:
            currentRoomCode,

          p_player_token:
            currentPlayerToken
        }
      );

    if (result.error) {
      throw result.error;
    }

    document
      .getElementById(
        "confirmRoleButton"
      )
      .classList.add("hidden");

    document
      .getElementById(
        "confirmedMessage"
      )
      .classList.remove("hidden");

    toast("確認しました");

    await refreshRoom();

  } catch (error) {

    console.error(error);

    toast(
      getErrorMessage(error)
    );

  }
}


/* =========================================================
   部屋に戻る
========================================================= */

async function backToRoom() {

  if (!currentIsOwner) {
    return;
  }

  try {

    const result =
      await supabaseClient.rpc(
        "back_to_room",
        {
          p_room_code:
            currentRoomCode,

          p_owner_token:
            currentOwnerToken
        }
      );

    if (result.error) {
      throw result.error;
    }

    closeDealScreen();

    toast(
      "部屋に戻りました"
    );

    await refreshRoom();

  } catch (error) {

    console.error(error);

    toast(
      getErrorMessage(error)
    );

  }
}


/* =========================================================
   役職一覧
========================================================= */

function renderRoleList(
  elementId
) {

  const container =
    document.getElementById(
      elementId
    );

  if (!container) {
    return;
  }

  container.innerHTML = "";

  Object.keys(ROLES).forEach(
    role => {

      const info =
        ROLES[role];

      const button =
        document.createElement("button");

      button.className =
        "role-card";

      button.onclick = () =>
        openRoleModal(role);


      let imageHtml = "";

      if (info.listImage) {

        imageHtml = `
          <img
            src="${info.listImage}"
            alt="${escapeAttr(role)}"
            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">

          <div class="role-image-placeholder hidden">
            ${info.emoji}
          </div>
        `;

      } else {

        imageHtml = `
          <div class="role-image-placeholder">
            ${info.emoji}
          </div>
        `;

      }


      button.innerHTML = `
        ${imageHtml}

        <h3>
          ${escapeHtml(role)}
        </h3>

        <p>
          ${escapeHtml(info.team)}
        </p>
      `;

      container.appendChild(
        button
      );

    }
  );
}


function showRoleList() {

  hideAllScreens();

  const section =
    document.getElementById(
      "roomScreen"
    );

  section.classList.remove(
    "hidden"
  );

  document
    .querySelector(
      "#roomScreen .room-header"
    )
    .classList.add("hidden");

  document
    .querySelector(
      "#roomScreen .room-grid"
    )
    .classList.add("hidden");

  document
    .querySelector(
      "#roomScreen .roles-title"
    )
    .textContent =
    "役職一覧";

  renderRoleList(
    "roomRoleList"
  );

  const back =
    document.createElement("button");

  back.textContent =
    "← 戻る";

  back.className =
    "back-button";

  back.style.marginBottom =
    "20px";

  back.onclick = () => {

    back.remove();

    goHome();

  };

  section
    .querySelector(".center")
    .prepend(back);
}


/* =========================================================
   役職詳細
========================================================= */

function openRoleModal(role) {

  const info =
    ROLES[role];

  if (!info) {
    return;
  }

  const content =
    document.getElementById(
      "roleModalContent"
    );

  let imageHtml = "";

  if (info.listImage) {

    imageHtml = `
      <img
        class="detail-image"
        src="${info.listImage}"
        alt="${escapeAttr(role)}"
        onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">

      <div class="detail-placeholder hidden">
        ${info.emoji}
      </div>
    `;

  } else {

    imageHtml = `
      <div class="detail-placeholder">
        ${info.emoji}
      </div>
    `;

  }


  content.innerHTML = `
    ${imageHtml}

    <h2 style="font-size:32px;margin-bottom:4px;">
      ${escapeHtml(role)}
    </h2>

    <div style="opacity:.65;margin-bottom:15px;">
      ${escapeHtml(info.team)}
    </div>

    <div class="detail-text">
      ${escapeHtml(info.description)}
    </div>
  `;

  document
    .getElementById(
      "roleModal"
    )
    .classList.remove("hidden");
}


function closeRoleModal(event) {

  if (
    event &&
    event.target !==
    document.getElementById(
      "roleModal"
    )
  ) {
    return;
  }

  document
    .getElementById(
      "roleModal"
    )
    .classList.add("hidden");
}


/* =========================================================
   ポーリング
   1秒ごとに部屋を確認
========================================================= */

function startPolling() {

  stopPolling();

  pollingTimer =
    setInterval(
      refreshRoom,
      1000
    );
}


function stopPolling() {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer = null;

  }
}


/* =========================================================
   エラー文章
========================================================= */

function getErrorMessage(error) {

  if (!error) {
    return "エラーが発生しました。";
  }

  const message =
    error.message || "";

  if (
    message.includes(
      "その部屋はありません"
    )
  ) {
    return "その部屋番号の部屋はありません。";
  }

  if (
    message.includes(
      "この部屋は満員です"
    )
  ) {
    return "この部屋は満員です。";
  }

  if (
    message.includes(
      "参加人数と役職数を同じ"
    )
  ) {
    return "参加人数と役職の合計人数を同じにしてください。";
  }

  if (
    message.includes(
      "部屋を作る"
    )
  ) {
    return "部屋を作れませんでした。";
  }

  return message ||
    "エラーが発生しました。";
}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttr(value) {
  return escapeHtml(value);
}


/* =========================================================
   最初の役職一覧
========================================================= */

renderRoleList(
  "roomRoleList"
);


/* =========================================================
   起動時に前回の部屋を復元
========================================================= */

async function restoreSession() {

  const roomCode =
    localStorage.getItem(
      "liora_room_code"
    );

  const playerToken =
    localStorage.getItem(
      "liora_player_token"
    );

  const ownerToken =
    localStorage.getItem(
      "liora_owner_token"
    );


  if (
    roomCode &&
    playerToken
  ) {

    currentRoomCode =
      roomCode;

    currentPlayerToken =
      playerToken;

    currentOwnerToken =
      ownerToken || null;

    currentIsOwner =
      !!ownerToken;

    await openRoom();

  }

}


restoreSession();

</script>
