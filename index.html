    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; overflow-y: auto; }
        h1 { color: #e74c3c; font-size: 24px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(231,76,60,0.4); }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 440px; margin: 20px auto; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background: #e74c3c; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .hidden { display: none !important; }
        
        /* 役職設定エリア */
        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; text-align: left; }
        .role-item { background: #2a2a2a; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border: 1px solid #444; }
        .role-item input { width: 50px; padding: 6px; margin: 0; text-align: center; font-size: 14px; }
        
        /* メンバーバッジと状態表示 */
        .member-badge { display: inline-block; background: #2980b9; padding: 6px 12px; border-radius: 20px; margin: 5px; font-weight: bold; }

        .info-title { color: #888; font-size: 14px; margin-top: 40px; margin-bottom: 10px; letter-spacing: 2px; }
        .role-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 440px; margin: 0 auto 40px auto; }
        .role-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .role-card:hover { transform: translateY(-2px); background: #252525; }
        
        /* 詳細ポップアップ */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #1e1e1e; border: 2px solid #444; padding: 25px; border-radius: 12px; max-width: 320px; width: 85%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; transform: translateY(30px); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.4s ease; }
        .modal-overlay.active .modal-content { transform: translateY(0); opacity: 1; animation: floatCard 3s ease-in-out infinite alternate; }
        @keyframes floatCard { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
        .modal-role-name { font-size: 28px; font-weight: bold; margin-bottom: 15px; }
        .modal-desc { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; text-align: left; white-space: pre-wrap; }
        .close-btn { background: #444; font-size: 14px; padding: 8px; width: auto; min-width: 100px; display: inline-block; margin: 0; }

        /* 暗転からのフェードイン結果画面 */
        .result-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000000; z-index: 90;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; 
        }
        .result-screen.active { opacity: 1; pointer-events: auto; }
        
        .result-content { opacity: 0; transition: opacity 1.2s ease-in-out 1.2s; text-align: center; width: 100%; }
        .result-screen.active .result-content { opacity: 1; }

        .illust-container { margin-top: 15px; min-height: 220px; display: flex; justify-content: center; align-items: center; }
        .illust-img { width: 75vw; max-width: 260px; height: auto; border-radius: 12px; display: block; }
        .no-img-box { width: 75vw; max-width: 260px; height: 200px; border: 2px dashed #333; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #555; font-size: 14px; }
        
        .waiting-msg { color: #f1c40f; font-size: 14px; margin-top: 20px; animation: blink 1s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>

    function createRoom() {
        myName = document.getElementById('playerName').value.trim();
        if (!myName) return alert("名前を入力してください");

        roomId = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;

        database.ref('rooms/' + roomId).set({
            host: myName,
            status: 'waiting',
            members: { [myName]: true }
        }).then(() => {
            enterRoom();
        }).catch(err => alert("部屋の作成に失敗しました: " + err.message));

        myName = document.getElementById('playerName').value.trim();

        if (!roomId) return alert("部屋番号を入力してください");

        const roomRef = database.ref('rooms/' + roomId);
        roomRef.once('value', (snapshot) => {
            if (!snapshot.exists()) {
                alert("指定された部屋が見つかりません");
                return;
            }
            roomRef.child('members').child(myName).set(true).then(() => {
                enterRoom();
            });
        });
    }

    // 待機画面の同期
    function enterRoom() {
        document.getElementById('homeScreen').classList.add('hidden');

            if(!listDiv) return;

                document.getElementById('resultScreen').classList.remove('active');

            }

            const members = [];
            snapshot.forEach(c => { members.push(c.key); });

            if (rolesToAssign.length < members.length) {
                return alert(`役職の合計数（${rolesToAssign.length}）が、現在の参加人数（${members.length}）より少ないです。人数分以上の役職を設定してください。`);
            }

            for (let i = rolesToAssign.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rolesToAssign[i], rolesToAssign[j]] = [rolesToAssign[j], rolesToAssign[i]];
            }

            const assignments = {};
            members.forEach((member, index) => {
                assignments[member] = rolesToAssign[index];
            });

            database.ref('rooms/' + roomId + '/confirmed_members').remove();

            database.ref('rooms/' + roomId + '/assignments').set(assignments).then(() => {
                database.ref('rooms/' + roomId + '/status').set('assigned');
            });
        });
    }

<script>
    // --- Firebaseの設定 ---
    const firebaseConfig = {
        databaseURL: "https://firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let roomId = "";
    let myName = "";
    let isHost = false;

    // 【部屋を作る（親）ボタン】
    function createRoom() {
        myName = document.getElementById('playerName').value.trim();
        if (!myName) { alert('名前を入力してください！'); return; }

        roomId = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;

        document.getElementById('homeScreen').classList.add('hidden');
        document.getElementById('roomScreen').classList.remove('hidden');
        document.getElementById('hostSection').classList.remove('hidden');
        document.getElementById('displayRoomId').innerText = roomId;

        database.ref('rooms/' + roomId).set({
            host: myName,
            status: "waiting"
        });

        joinMember();
        listenRoom();
    }

    // 【部屋に入る（子）ボタン】
    function joinRoom() {
        myName = document.getElementById('playerName').value.trim();
        roomId = document.getElementById('roomInput').value.trim();
        if (!myName || !roomId) { alert('名前と部屋番号を入力してください！'); return; }

        isHost = false;

        database.ref('rooms/' + roomId).once('value', (snapshot) => {
            if (!snapshot.exists()) {
                alert('その部屋は見つかりません。');
                return;
            }
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('roomScreen').classList.remove('hidden');
            document.getElementById('guestSection').classList.remove('hidden');
            document.getElementById('displayRoomId').innerText = roomId;

            joinMember();
            listenRoom();
        });
    }

    function joinMember() {
        database.ref('rooms/' + roomId + '/members/' + myName).set({
            confirmed: false
        });
    }

    function listenRoom() {
        database.ref('rooms/' + roomId + '/members').on('value', (snapshot) => {
            const members = snapshot.val() || {};
            const listDiv = document.getElementById('memberList');
            if (listDiv) {
                listDiv.innerHTML = "";
                for (let name in members) {
                    listDiv.innerHTML += `<span class="member-badge">${name}</span>`;
                }
            }
        });

        database.ref('rooms/' + roomId + '/status').on('value', (snapshot) => {
            if (snapshot.val() === "assigned") {
                getSummary();
            }
        });
    }

    // 【役職を配るボタン（親のみ）】
    function lockAndAssign() {
        if (!isHost) return;

        const roles = {
            '人狼': parseInt(document.getElementById('num_jinro').value) || 0,
            '村人': parseInt(document.getElementById('num_murabito').value) || 0,
            '狂人': parseInt(document.getElementById('num_kyojin').value) || 0,
            '占い師': parseInt(document.getElementById('num_uranaishi').value) || 0,
            '裁判官': parseInt(document.getElementById('num_saibankan').value) || 0,
            'スペシャルマン': parseInt(document.getElementById('num_specialman').value) || 0
        };

        let roleArray = [];
        for (let role in roles) {
            for (let i = 0; i < roles[role]; i++) {
                roleArray.push(role);
            }
        }

        database.ref('rooms/' + roomId + '/members').once('value', (snapshot) => {
            const members = snapshot.val();
            const memberNames = Object.keys(members);

            if (roleArray.length < memberNames.length) {
                alert('役職の数が足りません！');
                return;
            }

            roleArray.sort(() => Math.random() - 0.5);

            let updates = {};
            memberNames.forEach((name, index) => {
                updates['rooms/' + roomId + '/members/' + name + '/role'] = roleArray[index];
            });
            updates['rooms/' + roomId + '/status'] = "assigned";

            database.ref().update(updates);
        });
    }

    function getSummary() {
        database.ref('rooms/' + roomId + '/members/' + myName + '/role').once('value', (snapshot) => {
            const myRole = snapshot.val();
            const resultScreen = document.getElementById('result-screen');
            if (resultScreen) {
                resultScreen.classList.add('active');
            }
        });
    }
